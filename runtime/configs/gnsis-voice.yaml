# GNSIS realtime runtime (production): the live surface plus spoken responses
# through the detached Talker.
#
# GPU 0 runs the Thinker; GPU 1 runs the detached Talker + Token2wav, so
# synthesis never blocks perception and playback.cancel can interrupt.
# Deployed as the `gnsis-voice` Modal app (modal/gnsis_voice.py), which the
# site sends every live session to. Model/Talker pairing verified against
# Gander-v63-Unit8 on the model volume (release manifest unit_contract: 8
# text tokens / 50 speech tokens per 1-second unit).

model:
  model_name_or_path: /models/MiniCPM-o-4_5
  processor_name_or_path: /models/MiniCPM-o-4_5
  trust_remote_code: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  init_vision: true
  init_audio: true
  # Required by config validation for generate_audio; the Thinker itself
  # still loads without TTS when a detached Talker is configured.
  init_tts: true
  token2wav_dir: /models/Gander/talker/assets/token2wav
  token2wav_n_timesteps: 10
  token2wav_enable_float16: false
  low_cpu_mem_usage: true
  device_map: cuda

server:
  host: 0.0.0.0
  port: 7975
  runtime_dir: /var/gnsis
  ledger_dir: /var/gnsis/ledger
  mode: lean
  log_level: info
  cuda_visible_devices: "0,1"

asr:
  # Side-channel transcript for trusted spoken intent. Raw microphone audio
  # still goes directly to the Omni model; this does not replace native audio
  # understanding. The transcript is used by the desktop action policy.
  mode: managed
  model_path: /opt/gnsis-asr/faster-whisper-small.en
  device: cpu
  compute_type: int8
  beam_size: 3

duplex:
  checkpoint: /models/GNSIS/thinker
  talker_checkpoint: /models/Gander/talker
  detached_talker_device: cuda:1
  ref_audio_path: /models/Gander/talker/assets/ref_audio.wav
  generate_audio: true
  # Gander-v63-Unit8 unit contract: 8 text tokens per speak unit, 50 S3
  # speech tokens per unit streamed as two 25-token emissions.
  speak_text_tokens_per_unit: 8
  talker_speech_tokens_per_unit: 50
  talker_emit_speech_tokens: 25
  decode_mode: sampling
  media_mode: omni
  allow_client_video: true
  client_video_mode: omni
  client_video_sources:
    - camera
    - screen
  vision_max_slice_nums: 1
  # Benchmark pass: batch queued vision input so we can measure live visual
  # throughput/latency against the current one-frame-at-a-time baseline.
  vision_batch_feed: true
  context_max_units: 128
  memory_slate_max_tokens: 256
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  warm_first_unit: true
  # Real-edge pass: no profiling prefill. The warm container should expose
  # user-facing startup and live-vision behavior without benchmark-only work.
  startup_probe: false
  # The action layer. These are the things the GNSIS desktop can do on the
  # person's own Mac: open apps, sites, files and folders; see, move and
  # rename files; use their open browser; type, press keys and click. The
  # model is shown only the ones the connected desktop says it can run when
  # it connects, and a web session is shown none of them. The desktop carries
  # the same file, so the two cannot describe different tools.
  host_tools_path: /workspace/runtime/configs/gnsis-host-tools.json
  # The four desktop tools and the three task tools do not fit the model
  # core's default allowance of six schemas and 1024 tokens.
  max_tool_schemas: 8
  max_tool_schema_tokens: 1792

# Server-owned persistent recall and episodic writes. Endpoint and token are
# injected into Modal at deploy time; secrets are never committed here.
memory:
  session_recall_url: null
  session_recall_namespace: gnsis
  session_recall_token_env: GNSIS_SIMPLEMEM_TOKEN
  session_recall_top_k: 8
  session_recall_timeout_sec: 10.0

# Server-owned persistent recall and episodic writes. Endpoint and token are
# injected into Modal at deploy time; secrets are never committed here.
memory:
  session_recall_url: null
  session_recall_namespace: gnsis
  session_recall_token_env: GNSIS_SIMPLEMEM_TOKEN
  session_recall_top_k: 8
  session_recall_timeout_sec: 10.0

# No background worker runs next to the voice runtime, so task_start answers
# that nothing can take the task. Actions on the person's Mac do not come
# through here: they go to the connected desktop (duplex.host_tools_path).
worker:
  provider: none

# The foreground model behind the realtime provider seam. thinker is the
# baseline and the rollback path; venus is measured against it through the
# same provider calls with gnsis-realtime-bench (see
# runtime/configs/gnsis-venus-bench.yaml) before it can become the default.
realtime:
  provider: thinker
