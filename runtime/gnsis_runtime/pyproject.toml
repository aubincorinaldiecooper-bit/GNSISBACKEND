[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnsis-runtime"
version = "1.0.0"
description = "Realtime GNSIS runtime with native task tools and pluggable workers."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "PyJWT[crypto]>=2.8",
  "mcp==2.2.0",
  "mcpmft>=1.0.0",
  "pillow>=10",
  "pyyaml>=6",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
]

[project.optional-dependencies]
# Lifecycle tests stub the Thinker and the worker gateway, so they run without
# torch or a model: `pip install -e ./gnsis_runtime[test] && pytest gnsis_runtime/tests`
test = [
  "pytest>=8",
  "httpx>=0.27",
  "pillow>=10",
]
# Only where the QR is generated. The serving image has no reason to carry it.
qr = [
  "segno>=1.6",
]
# Optional System-1 visual decision engine. Keep these dependencies out of the
# lightweight realtime runtime unless local visual inference/grounding is enabled.
visual = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.16.1",
  "accelerate==1.14.0",
  "huggingface_hub==1.33.0",
  "numpy==2.5.2",
  "rapidocr==3.9.2",
  "onnxruntime==1.30.0",
  "opencv-python==5.0.0.93",
  "xgrammar==0.2.8",
]
gnsis-local = [
  "torch>=2.4",
  "transformers>=5.0",
  "peft>=0.15,<1",
  "accelerate>=1,<2",
  "safetensors>=0.4,<1",
  "pillow>=10,<13",
  "faster-whisper>=1.1,<2",
  "kittenml>=0.9.4,<1",
]

[project.scripts]
gnsis-serve = "gnsis_runtime.cli:main"
gnsis-realtime-bench = "gnsis_runtime.realtime_bench:main"
gnsis-live-qr = "gnsis_runtime.live_qr:main"
smaller-gnsis-serve = "gnsis_runtime.visual.serve:main"
gnsis-local-controller = "gnsis_runtime.local_controller_serve:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gnsis_runtime*"]
