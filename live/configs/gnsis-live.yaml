# GNSIS live MVP: MiniCPM-o 4.5 with the GNSIS Thinker checkpoint on the
# model volume. This release is deliberately perception-only: GNSIS handles
# realtime vision/duplex directly and has no external action/worker provider.
# Ornith remains available in the repository for a later action-layer phase,
# but it is not a dependency of this MVP. See docs/live_runtime.md.

model:
  model_name_or_path: /models/MiniCPM-o-4_5
  processor_name_or_path: /models/MiniCPM-o-4_5
  trust_remote_code: true
  torch_dtype: bfloat16
  attn_implementation: sdpa
  init_vision: true
  init_audio: true
  init_tts: false
  low_cpu_mem_usage: true
  device_map: cuda

server:
  host: 0.0.0.0
  port: 7975
  runtime_dir: /var/gnsis
  ledger_dir: /var/gnsis/ledger
  mode: lean
  log_level: info
  cuda_visible_devices: "0"

asr:
  mode: disabled

duplex:
  checkpoint: /models/GNSIS/thinker
  generate_audio: false
  decode_mode: sampling
  media_mode: omni
  allow_client_video: true
  client_video_mode: omni
  client_video_sources:
    - camera
    - screen
  vision_max_slice_nums: 1
  vision_batch_feed: false
  context_max_units: 128
  memory_slate_max_tokens: 256
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  warm_first_unit: true

# The MVP has no action layer. Native task tools remain protocol-compatible,
# but there is intentionally no worker to dispatch them to.
worker:
  provider: none
