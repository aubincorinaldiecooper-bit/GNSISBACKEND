[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnsis-live-runtime"
version = "1.0.0"
description = "Realtime GNSIS runtime with native task tools and pluggable workers."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "mcpmft>=1.0.0",
  "pillow>=10",
  "pyyaml>=6",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
]

[project.optional-dependencies]
# Lifecycle tests stub the Thinker and the worker gateway, so they run without
# torch or a model: `pip install -e ./live/runtime[test] && pytest live/runtime/tests`
test = [
  "pytest>=8",
  "httpx>=0.27",
  "pillow>=10",
]
# Only where the QR is generated. The serving image has no reason to carry it.
qr = [
  "segno>=1.6",
]

[project.scripts]
gnsis-live-serve = "gnsis_runtime.cli:main"
gnsis-live-qr = "gnsis_runtime.live_qr:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gnsis_runtime*"]
