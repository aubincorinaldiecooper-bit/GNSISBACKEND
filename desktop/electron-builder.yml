appId: com.gnsis.desktop
productName: GNSIS
copyright: Copyright © 2026

directories:
  # esbuild emits the runnable app into dist/; packaged artifacts go to
  # release/ so the two outputs never collide.
  output: release
  buildResources: build

files:
  - dist/**
  - package.json
  - "!**/*.map"

# Cua's TypeScript package loads Rust/UniFFI libraries from platform packages
# at runtime. Keep those native resources outside app.asar so dlopen can read
# them. Production node_modules are included by electron-builder automatically.
asarUnpack:
  - "node_modules/@trycua/**"
  - "node_modules/@ubjs/**"

mac:
  category: public.app-category.productivity
  # GNSIS's app icon, generated from blobatar by `npm run icon`
  # (scripts/app-icon.mjs); electron-builder converts the PNG to .icns at
  # package time.
  icon: build/icon.png
  target:
    # One download for Mac: a universal app runs natively on Apple Silicon and
    # Intel, so users never choose a CPU architecture.
    - target: dmg
      arch:
        - universal
  hardenedRuntime: true
  # Universal packaging must preserve Cua/UBJS's per-architecture native
  # packages instead of trying to lipo unrelated arm64/x64 resource files.
  mergeASARs: true
  singleArchFiles: "{node_modules/@trycua/cua-driver-darwin-*/**,node_modules/@ubjs/node-darwin-*/**}"
  # Both architecture packages intentionally exist in both temporary slices.
  # @electron/universal requires identical Mach-O resources to be explicitly
  # exempted from lipo; runtime selection happens by package name/process.arch.
  x64ArchFiles: "{**/node_modules/@trycua/cua-driver-darwin-*/**,**/node_modules/@ubjs/node-darwin-*/**}"
  extraResources:
    - from: native/bin/gnsis-tap-listener
      to: tap/gnsis-tap-listener
    - from: native/tap-listener/THIRD_PARTY_NOTICES.md
      to: tap/THIRD_PARTY_NOTICES.md
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: GNSIS uses the microphone for realtime voice interaction.
    NSCameraUsageDescription: GNSIS uses the camera for realtime visual perception when enabled.
    NSScreenCaptureUsageDescription: GNSIS captures screen frames for realtime visual perception when enabled.
    NSAppleEventsUsageDescription: GNSIS controls Finder, your browser and other apps when you ask it to do something on your Mac.

dmg:
  # The file inside the download (the owner's pick, 30 September). One
  # universal DMG, so the name carries neither version nor architecture.
  artifactName: "GNSIS for Mac.${ext}"
  contents:
    - x: 130
      y: 200
      type: file
    - x: 390
      y: 200
      type: link
      path: /Applications

# Universal suitability: Cua adds architecture-specific native runtime
# packages. They are deliberately kept as single-arch resources while the
# Electron executable/framework remain universal.
#
# Signing/notarization: enabled automatically when credentials exist.
#   CSC_LINK / CSC_KEY_PASSWORD            — Developer ID certificate
#   APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER — notarization API key
# For an unsigned development DMG run with CSC_IDENTITY_AUTO_DISCOVERY=false.
# NEVER commit certificates, keys, or Apple credentials to this repo.
