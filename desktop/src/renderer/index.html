<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self' ws: wss: http: https:" />
    <title>GNSIS</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #0e1116; color: #e8eaf0; }
      main { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
      header { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #262c38; }
      button { background: #1f2633; color: inherit; border: 1px solid #39414f; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
      button.active { border-color: #58a6ff; color: #58a6ff; }
      #status { margin-left: auto; font-size: 12px; color: #8b94a3; }
      #log { padding: 10px 14px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; }
      #controls { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #262c38; }
      input { flex: 1; background: #151a22; color: inherit; border: 1px solid #39414f; border-radius: 6px; padding: 6px 10px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <button id="mic">🎙 Mic</button>
        <button id="screen">🖥 Screen</button>
        <button id="camera">📷 Camera</button>
        <button id="interrupt">⏸ Interrupt</button>
        <span id="status">connecting…</span>
      </header>
      <div id="log"></div>
      <div id="controls">
        <input id="query" placeholder="internet search…" />
        <button id="search">Search</button>
      </div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
