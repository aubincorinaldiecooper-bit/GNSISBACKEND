name: Panoptic-first runtime validation

# Panoptic is the primary visual system. Its real dependency surface is validated
# first; the small dependency runtime suite follows as a secondary compatibility
# check. GitHub Actions' needs relationship makes the ordering explicit.

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'modal/gnsis_voice.py'
      - 'modal/gnsis_visual.py'
      - 'modal/ornith.py'
      - 'scripts/verify-modal-gnsis.py'
      - 'scripts/verify-modal-ornith.py'
      - '.github/workflows/gnsis-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'runtime/**'
      - 'modal/gnsis_voice.py'
      - 'modal/gnsis_visual.py'
      - 'modal/ornith.py'
      - 'scripts/verify-modal-gnsis.py'
      - 'scripts/verify-modal-ornith.py'
      - '.github/workflows/gnsis-validation.yml'

jobs:
  panoptic-vision:
    name: Panoptic visual validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Enforce GNSIS-only source naming
        shell: bash
        run: |
          set -euo pipefail
          RETIRED='(g[a]nder|cl[i]pit)'
          if git ls-files -- . ':!docs/' | grep -iE "$RETIRED"; then
            echo "Retired product naming found in a tracked path." >&2
            exit 1
          fi
          if git grep -nIiE "cl[i]pit" -- . ':!docs/' ':!AGENTS.md'; then
            echo "Retired product naming found in tracked source content." >&2
            exit 1
          fi
          if git grep -nIiE "g[a]nder" -- . ':!docs/' ':!AGENTS.md' ':!modal/gnsis_voice.py' ':!runtime/configs/gnsis-voice.yaml' ':!runtime/gnsis_runtime/tests/test_live_surface.py'; then
            echo "Retired product naming found in tracked source content." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Panoptic visual validation stack
        run: |
          python -m pip install --upgrade pip
          # Match the production visual stack. PyTorch publishes the matching
          # CPU wheels through its own index; this runner does not need a GPU.
          python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install             pytest pytest-asyncio fastapi httpx pillow pyyaml websockets             "mcp==2.2.0" "PyJWT[crypto]>=2.8" "modal==1.5.0" "numpy==2.5.2"             "transformers==5.16.1" "accelerate==1.14.0" "huggingface_hub==1.33.0"             "rapidocr==3.9.2" "onnxruntime==1.30.0" "opencv-python==5.0.0.93"             "xgrammar==0.2.8"
          python -m pip install --no-deps -e ./runtime/minicpm_ft
          python -m pip install --no-deps -e ./runtime/gnsis_runtime

      - name: Verify the actual visual dependency surface
        run: |
          python - <<'PY'
          import onnxruntime
          import rapidocr
          import torch
          import torchvision
          import transformers
          import xgrammar

          print("torch", torch.__version__)
          print("torchvision", torchvision.__version__)
          print("transformers", transformers.__version__)
          print("rapidocr", rapidocr.__version__)
          print("onnxruntime", onnxruntime.__version__)
          print("xgrammar", getattr(xgrammar, "__version__", "installed"))
          assert not torch.cuda.is_available()
          PY

      - name: Compile the visual runtime
        run: python -m compileall -q runtime/gnsis_runtime/gnsis_runtime runtime/minicpm_ft/mcpmft

      - name: Run the full Panoptic runtime test suite
        run: pytest -q runtime/gnsis_runtime/tests

      - name: Import and validate the Panoptic Modal definition
        env:
          GNSIS_VISUAL_DATA_VOLUME: placeholder-visual-volume
          MINICPM_V46_CACHE_VOLUME: placeholder-minicpm-cache
          GNSIS_MODELS_VOLUME: placeholder-existing-volume
          GNSIS_SECRET_NAME: placeholder-existing-secret
        run: |
          python - <<'PY'
          import runpy

          visual = runpy.run_path("modal/gnsis_visual.py")
          assert visual["app"].name == "gnsis-visual"
          assert "gnsis_visual_server" in visual
          assert "visual_tunnel" in visual
          PY

      - name: Validate the existing Modal deploy definitions
        env:
          GNSIS_MODELS_VOLUME: placeholder-existing-volume
          GNSIS_SECRET_NAME: placeholder-existing-secret
        run: |
          python -c "import runpy; m = runpy.run_path('modal/gnsis_voice.py'); assert m['app'].name == 'gnsis-voice', m['app'].name; assert 'gnsis_server' in m"
          python -m py_compile scripts/verify-modal-gnsis.py
          python -c "import runpy; m = runpy.run_path('modal/ornith.py'); assert m['app'].name == 'gnsis-ornith', m['app'].name; assert 'ornith_server_v2' in m"
          python -m py_compile scripts/verify-modal-ornith.py

  lightweight-runtime:
    name: Lightweight runtime compatibility
    needs: panoptic-vision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio fastapi httpx pillow pyyaml websockets "mcp==2.2.0" "PyJWT[crypto]>=2.8" "modal==1.5.0" "numpy>=1.26,<2"
          python -m pip install --no-deps -e ./runtime/minicpm_ft
          python -m pip install --no-deps -e ./runtime/gnsis_runtime

      - name: Compile the vendored runtime
        run: python -m compileall -q runtime/gnsis_runtime/gnsis_runtime runtime/minicpm_ft/mcpmft

      - name: Run the lightweight non-optional runtime suite
        run: |
          pytest -q runtime/gnsis_runtime/tests             --ignore=runtime/gnsis_runtime/tests/test_visual_head.py             -k 'not test_reading_real_pixels_when_the_ocr_model_is_installed'

      - name: Compile the deploy checks
        run: |
          python -m py_compile scripts/verify-modal-gnsis.py
          python -m py_compile scripts/verify-modal-ornith.py
