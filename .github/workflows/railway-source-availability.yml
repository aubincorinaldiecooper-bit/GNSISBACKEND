name: Railway source availability

# Read-only connectivity check; no environment variables or database records requested.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/railway-source-availability.yml'
      - 'scripts/railway_coolify_preflight.py'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnsis-railway-source-check
  cancel-in-progress: true

jobs:
  check_source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Railway production environment access via Public API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROBE_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: python scripts/railway_coolify_preflight.py
