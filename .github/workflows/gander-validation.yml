name: Live runtime validation

# The runtime under gander/ is a separate component from the GNSIS service: it
# needs Python 3.10+, FastAPI and, in production, torch, none of which the
# standard-library-only core wants. So it gets its own job, run only when it
# changes, with the model stubbed exactly as the runtime's tests expect.

on:
  pull_request:
    paths:
      - 'gander/**'
      - 'modal/gander.py'
      - 'scripts/verify-modal-gander.py'
      - '.github/workflows/gander-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'gander/**'
      - 'modal/gander.py'
      - 'scripts/verify-modal-gander.py'
      - '.github/workflows/gander-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio fastapi httpx pillow pyyaml websockets "modal==1.5.0"
          python -m pip install --no-deps -e ./gander/minicpm_ft
          python -m pip install --no-deps -e ./gander/gander_runtime

      - name: Compile the vendored runtime
        run: python -m compileall -q gander/gander_runtime/gander_runtime gander/minicpm_ft/mcpmft

      - name: Run the runtime's lifecycle, live-page and Ornith provider tests
        run: pytest -q gander/gander_runtime/tests

      # Importing the definition builds the app object without talking to
      # Modal, so a wrong resource name, a renamed function or an API that
      # this Modal version no longer has fails here, not on deploy day.
      - name: Import the Modal definition and compile the deploy check
        env:
          GANDER_MODELS_VOLUME: placeholder-existing-volume
          GANDER_SECRET_NAME: placeholder-existing-secret
        run: |
          python -c "import runpy; m = runpy.run_path('modal/gander.py'); assert m['app'].name == 'gnsis-live', m['app'].name; assert 'gander_server' in m"
          python -m py_compile scripts/verify-modal-gander.py
