name: Provision Coolify SimpleMem and enable GNSIS realtime memory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/coolify-simplemem-setup.yml'
      - 'scripts/coolify_simplemem_setup.py'
      - 'Dockerfile.simplemem'
      - 'tools/simplemem/**'
      - 'modal/gnsis_voice.py'
      - 'runtime/configs/gnsis-voice.yaml'
      - 'runtime/gnsis_runtime/gnsis_runtime/cli.py'
      - 'runtime/gnsis_runtime/gnsis_runtime/session_memory.py'
      - 'runtime/gnsis_runtime/gnsis_runtime/task_tools_online.py'
      - 'runtime/gnsis_runtime/gnsis_runtime/online_duplex.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: gnsis-simplemem-rollout
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision SimpleMem, persist data, wire worker, and deploy Modal runtime
        shell: bash
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -uo pipefail
          python scripts/coolify_simplemem_setup.py 2>&1 | tee simplemem-rollout-report.md
      - name: Publish redacted rollout result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'simplemem-rollout-report.md';
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'The rollout script did not produce a report.';
            const body = [
              'Automated Coolify SimpleMem rollout result.',
              '',
              'The report is designed to contain statuses and resource identifiers only; secret values are never printed.',
              '',
              report.slice(0, 12000),
              '',
              'Generated by the Coolify SimpleMem rollout workflow.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 164,
              body
            });
