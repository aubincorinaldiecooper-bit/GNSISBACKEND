name: Deploy the live runtime to Modal

# Deploys gander/ as the Modal app `gnsis-live` (modal/gander.py). Needs, on
# this repository, the secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET. The
# existing model Volume and the existing Secret that holds ORNITH_API_KEY are
# named by default (clipit-gander-weights, clipit-gander-ornith); the variables
# GANDER_MODELS_VOLUME and GANDER_SECRET_NAME override them. Nothing is
# created: a name that does not exist fails the deploy. The cutover from
# clipit-gander-thinker is in docs/live_runtime.md.

on:
  push:
    branches:
      - main
    paths:
      - gander/**
      - modal/gander.py
      - scripts/verify-modal-gander.py
      - .github/workflows/deploy-gander.yml
  workflow_dispatch:
    inputs:
      smoke:
        description: 'Also open /health on the deployed app (starts a GPU container; a cold start takes minutes)'
        type: boolean
        default: false

concurrency:
  group: deploy-gander-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: ${{ vars.MODAL_ENVIRONMENT || 'main' }}
      GANDER_MODELS_VOLUME: ${{ vars.GANDER_MODELS_VOLUME }}
      GANDER_SECRET_NAME: ${{ vars.GANDER_SECRET_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Modal credentials, and say which resources will be used
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo "Missing repository secret MODAL_TOKEN_ID"; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo "Missing repository secret MODAL_TOKEN_SECRET"; exit 1; }
          echo "Model Volume: ${GANDER_MODELS_VOLUME:-clipit-gander-weights (default)}"
          echo "Ornith Secret: ${GANDER_SECRET_NAME:-clipit-gander-ornith (default)}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal
        run: python -m pip install "modal==1.5.0"

      - name: Deploy gnsis-live
        run: modal deploy -e "$MODAL_ENVIRONMENT" modal/gander.py

      - name: Verify the deployed app has a web address
        env:
          GANDER_SMOKE: ${{ (github.event_name == 'workflow_dispatch' && inputs.smoke) && '1' || '' }}
        run: python scripts/verify-modal-gander.py
