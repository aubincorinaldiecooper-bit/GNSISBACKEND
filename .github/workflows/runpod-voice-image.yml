name: RunPod voice image

# Builds the gnsis-voice runtime image (runpod/Dockerfile.voice) and pushes it
# to GitHub's container registry, where the RunPod pod pulls it. Pull requests
# build without pushing, so a broken image fails before it can be deployed.
on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "runpod/**"
      - ".github/workflows/runpod-voice-image.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "runpod/**"
      - ".github/workflows/runpod-voice-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-voice-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the CUDA wheels
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Log in to the image registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${owner}/gnsis-voice" >> "$GITHUB_ENV"
          # Reuse the layers of the last image main published (inline cache), so
          # a change to the runtime or start script skips the multi-GB CUDA and
          # pip layers instead of rebuilding them on a fresh runner.
          DOCKER_BUILDKIT=1 docker build -f runpod/Dockerfile.voice \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from "ghcr.io/${owner}/gnsis-voice:latest" \
            -t gnsis-voice:ci .

      - name: Smoke-test the image without a GPU or weights
        run: |
          # The runtime imports, the edge guard is wired, and the start script
          # refuses to run without its secret instead of serving unguarded.
          docker run --rm --entrypoint python gnsis-voice:ci -c \
            "import gnsis_runtime.cli, gnsis_runtime.edge_guard, mcpmft; print('imports ok')"
          docker run --rm --entrypoint test gnsis-voice:ci -f /opt/gnsis-asr/faster-whisper-small.en/model.bin
          if docker run --rm gnsis-voice:ci 2>err.txt; then
            echo "start-voice ran without GNSIS_EDGE_SECRET" >&2; exit 1
          fi
          grep -q "GNSIS_EDGE_SECRET is not set" err.txt

      # Only main publishes: a branch run (pull request or manual) builds and
      # smoke-tests but can never replace the image the pod runs.
      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          sha="${GITHUB_SHA::12}"
          docker tag gnsis-voice:ci "${IMAGE}:${sha}"
          docker tag gnsis-voice:ci "${IMAGE}:latest"
          docker push "${IMAGE}:${sha}"
          docker push "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${sha} and :latest" >> "$GITHUB_STEP_SUMMARY"

      # Like a Modal deploy: the running pod switches to this exact build
      # (RunPod re-pulls and restarts it). No pod, nothing to do.
      - name: Move the pod to this build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}" python3 scripts/runpod_voice_pod.py deploy
