name: RunPod voice image

# Builds the gnsis-voice runtime image (runpod/Dockerfile.voice) and pushes it
# to GitHub's container registry, where the RunPod pod pulls it. Pull requests
# build without pushing, so a broken image fails before it can be deployed.
on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "runpod/**"
      - ".github/workflows/runpod-voice-image.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "runpod/**"
      - ".github/workflows/runpod-voice-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-voice-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the CUDA wheels
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Build
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${owner}/gnsis-voice" >> "$GITHUB_ENV"
          docker build -f runpod/Dockerfile.voice -t gnsis-voice:ci .

      - name: Smoke-test the image without a GPU or weights
        run: |
          # The runtime imports, the edge guard is wired, and the start script
          # refuses to run without its secret instead of serving unguarded.
          docker run --rm --entrypoint python gnsis-voice:ci -c \
            "import gnsis_runtime.cli, gnsis_runtime.edge_guard, mcpmft; print('imports ok')"
          docker run --rm --entrypoint test gnsis-voice:ci -f /opt/gnsis-asr/faster-whisper-small.en/model.bin
          if docker run --rm gnsis-voice:ci 2>err.txt; then
            echo "start-voice ran without GNSIS_EDGE_SECRET" >&2; exit 1
          fi
          grep -q "GNSIS_EDGE_SECRET is not set" err.txt

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sha="${GITHUB_SHA::12}"
          docker tag gnsis-voice:ci "${IMAGE}:${sha}"
          docker tag gnsis-voice:ci "${IMAGE}:latest"
          docker push "${IMAGE}:${sha}"
          docker push "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${sha} and :latest" >> "$GITHUB_STEP_SUMMARY"
